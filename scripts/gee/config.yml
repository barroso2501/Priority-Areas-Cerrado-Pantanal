# Configuration of the Earth Engine extraction (decisions D6-D9).
# Values marked VERIFY must be confirmed by 00_discover_assets.py before any extraction.

gee_project: "ee-barroso2501"             # Cloud project registered for non-commercial EE use

# Zones uploaded from data/interim/zones_upload.zip (field: zone_id)
zones_asset: "projects/ee-barroso2501/assets/zones_upload"   # uploaded 2026-10-03
# Bounding box of the zones [xmin, ymin, xmax, ymax], EPSG:4674, padded by 0.05 deg.
# Computed locally by 01_prepare_zones_upload.py: Earth Engine cannot union the zones
# (2.8 M edges > 2 M limit), so the region is never derived from the collection.
zones_bbox: [-60.53, -24.74, -41.22, -2.28]

years: {first: 1985, last: 2025}

mapbiomas:
  # Folder roots scanned by 00_discover_assets.py
  search_roots:
    - "projects/mapbiomas-public/assets/brazil/lulc"
    - "projects/mapbiomas-public/assets/brazil/fire"
  # LULC Collection 11, integrated national image, one band per year
  lulc_asset: "projects/mapbiomas-public/assets/brazil/lulc/collection11/mapbiomas_brazil_collection11_coverage_v3"
  lulc_band_pattern: "classification_{year}"
  # MapBiomas Fire Collection 5.1 (1985-2025): monthly burned area, value = month (1-12)
  fire_monthly_asset: "projects/mapbiomas-public/assets/brazil/fire/collection5_1/mapbiomas_fire_collection51_monthly_burned_v1"
  fire_monthly_band_pattern: "burned_monthly_{year}"

export:
  # Earth Engine accepts only a folder NAME (not a path): it creates/uses this folder at the
  # root of "My Drive". Move it under Trabalho/APCerrado afterwards if you wish.
  drive_folder: "APCerrado_gee_exports"
  tile_scale: 4                           # raise to 8/16 if tasks fail with memory errors

fire_intervals:
  # Analysis windows for D9 (stable native pixels only). The full series is the reference;
  # period windows are added once D1 (milestones) is decided.
  windows:
    - {name: "w1985_2025", start: 1985, end: 2025}

product1:
  # Product 1 for MMA (D13): natural-vegetation state and dynamics 2012-2025.
  # Direct transitions class(start) -> class(end) per zone; one export per pair.
  transition_pairs:
    - [2012, 2025]
    - [2012, 2018]
    - [2018, 2025]
  # Persistence of natural vegetation present in the start year, per zone and start class.
  # 1985-2025 gives the share never converted since the start of the series (old-growth proxy).
  persistence_windows:
    - {name: "p2012_2025", start: 2012, end: 2025}
    - {name: "p1985_2025", start: 1985, end: 2025}
  # "Possible reservoir" flag (D13 section 5): natural vegetation in the start year that is
  # water (class below) in EVERY one of the last N years of the window.
  water_class: 33
  water_final_years: 6

fire_regime:
  # Product 2 (D15): fire regime in natural vegetation stable 1985-2025.
  stability: {start: 1985, end: 2025}       # stable = natural vegetation in every year
  fire_year_start_month: 4                   # fire year y = April y .. March y+1
  subperiods:
    - {name: "sp1", start: 2012, end: 2018}
    - {name: "sp2", start: 2019, end: 2025}
  # Critical fire window by latitude band (D15 §5): calendar months, three-month windows.
  # 12-18 S and south of 18 S: July-September; north of 12 S: August-October (later season
  # northwards). Both confirmed by the project lead (D15, 2026-10-06).
  season_bands:
    - {lat_min: -90, lat_max: -12, months: [7, 8, 9]}
    - {lat_min: -12, lat_max: 90, months: [8, 9, 10]}
  no_natural_ignition_months: [7, 8]         # no natural ignition (lightning) in these months
  # Vegetation types by modal class 1985-2025 (code: classes)
  types: {1: [3, 6], 2: [4], 3: [12], 4: [11, 7]}   # 1 forest, 2 savanna, 3 grassland, 4 wetland
  # Expected interval 3-20 years; excess = repeated intervals below 3 years (D15 §4)
  thresholds: {expected_min: 3, expected_max: 20, excess_short_intervals: 2}
